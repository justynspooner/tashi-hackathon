[package]
name = "warmup-vertex-rust"
version = "0.1.0"
edition = "2021"
description = "Tashi Vertex Warmup - Stateful Handshake implementation"

[[bin]]
name = "node"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tashi-vertex = { git = "https://github.com/tashigit/tashi-vertex-rs.git" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
